[project]
name = "invoice-module"
dynamic = ["version"]
description = "Reusable VAT e-invoice module: one SePay eInvoice original invoice per payment-module settlement."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy[asyncio]>=2.0,<3", "alembic>=1.13"]
postgres = ["asyncpg>=0.29"]
sepay = ["httpx>=0.28"]
payment = ["payment-module[sqlalchemy]>=0.1,<0.2"]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.3",
    "pytest-timeout>=2.3",
    "ruff>=0.14",
    "testcontainers[postgres]>=4",
    "payment-module[sqlalchemy,postgres,sepay,fastapi]>=0.1,<0.2",
    "uvicorn>=0.30",
]

[tool.uv.sources]
payment-module = { url = "https://github.com/phanhaitrieu37/payment-modules/releases/download/v0.1.0/payment_module-0.1.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/invoice_module/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src/invoice_module", "/README.md", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "--import-mode=importlib --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
markers = [
    "integration: tests under tests/integration; need PostgreSQL",
    "acceptance: end-to-end acceptance on PostgreSQL with the fake provider",
    "contract: SePay eInvoice payload contract tests from recorded sandbox fixtures",
    "postgres: needs PostgreSQL (testcontainers postgres:17 or DATABASE_URL)",
    "sandbox: tests under tests/sandbox; call the SePay eInvoice sandbox; need INVOICE_SANDBOX_ENV_FILE; never in CI",
]
